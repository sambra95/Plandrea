# Calm, low-contrast light theme: one muted indigo accent on a warm off-white,
# tinted to match the app icon.
[theme]
base = "light"
primaryColor = "#4F5D95"
backgroundColor = "#FDFBF8"
secondaryBackgroundColor = "#F4F0E9"
codeBackgroundColor = "#F6F3EB"
textColor = "#2A2315"
linkColor = "#4F5D95"
borderColor = "#C8BFAA"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
baseFontSize = 14
headingFontSizes = ["30px", "22px", "18px", "16px", "14px", "13px"]
headingFontWeights = [600, 600, 600, 500, 500, 500]
linkUnderline = false

[server]
# Served under the app's name, so the address bar says what it is rather than
# just a port. bootstrap.py opens the same path.
baseUrlPath = "plandrea"

[client]
# No Deploy button or developer menu: this app is not deployed anywhere.
toolbarMode = "viewer"
